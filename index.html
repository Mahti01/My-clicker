<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111318">
<title>City Economy</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app" class="app">
<section id="main-menu" class="screen screen--menu">
<div class="menu-card"><div class="brand-mark">CITY</div><h1>Экономика города</h1><p>Построй город. Развивай бизнес. Управляй экономикой.</p>
<div class="menu-actions"><button class="button button--primary" data-action="new-game">Новая игра</button><button class="button" data-action="continue-game" id="continue-button">Продолжить</button><button class="button button--ghost" data-action="settings">Настройки</button></div>
<div class="menu-version">v0.3.0 • building</div></div></section>
<section id="game-screen" class="screen screen--game hidden">
<header class="topbar"><div class="stat"><span class="stat__icon">💰</span><span id="money-value">10 000 ₽</span></div><div class="stat"><span class="stat__icon">⭐</span><span id="level-value">Ур. 1</span></div><div class="topbar__status" id="save-status">Сохранено</div></header>
<main id="world" class="world" aria-label="Игровой мир">
<div id="world-canvas" class="world__canvas">
<div class="world__terrain"></div>
<div class="world__map">
<div class="city-tile" style="left:18%;top:25%"></div><div class="city-tile" style="left:82%;top:25%"></div><div class="city-tile" style="left:18%;top:75%"></div><div class="city-tile" style="left:82%;top:75%"></div>
<div class="plaza"></div>
<div id="roads-layer" class="world-layer world-layer--roads"></div>
<div id="buildings-layer" class="world-layer world-layer--buildings"></div>
<div id="build-preview" class="world-layer world-layer--preview"></div>
<div class="tree tree--1">🌳</div><div class="tree tree--2">🌲</div><div class="tree tree--3">🌳</div><div class="tree tree--4">🌲</div>
<div class="decor decor--1">💡</div><div class="decor decor--2">💡</div><div class="decor decor--3">🌿</div><div class="decor decor--4">🌿</div>
</div></div>
<div id="world-message" class="world-message"></div>
</main>
<nav class="tabs" aria-label="Разделы"><button class="tab is-active" data-tab="city"><span>🏙️</span>Город</button><button class="tab" data-tab="shop"><span>🛒</span>Магазин</button><button class="tab" data-tab="economy"><span>📊</span>Экономика</button><button class="tab" data-tab="build"><span>🏗️</span>Строить</button><button class="tab" data-tab="storage"><span>📦</span>Склад</button><button class="tab" data-tab="settings"><span>⚙️</span>Настройки</button></nav>
<div id="panel" class="panel hidden"></div><button class="button button--back" data-action="menu">← Меню</button>
</section></div><script type="module" src="./js/main.js"></script></body></html>
