<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My Clicker — Город</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#9fbca0;color:#17221c}
button{font:inherit;cursor:pointer}body{overscroll-behavior:none}
.screen{position:fixed;inset:0}.hidden{display:none!important}
#menu{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#a9c9ae,#dfe5c9 55%,#8fae91)}
.menu-bg{position:absolute;inset:0;overflow:hidden}
.menu-bg:before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:rgba(255,255,255,.2);left:-240px;top:-250px}
.menu-bg:after{content:"";position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(72,105,74,.13);right:-190px;bottom:-210px}
.menu-card{position:relative;width:min(430px,calc(100% - 34px));padding:36px 30px 30px;background:rgba(250,249,242,.91);border:1px solid rgba(255,255,255,.7);border-radius:28px;box-shadow:0 24px 70px rgba(38,57,43,.22);backdrop-filter:blur(16px);text-align:center}
.logo{font-size:13px;letter-spacing:4px;font-weight:900;color:#657a64;margin-bottom:10px}.title{font-size:42px;line-height:.95;font-weight:900;letter-spacing:-2px;margin:0}.subtitle{color:#66716a;font-size:13px;margin:12px 0 27px}
.menu-actions{display:grid;gap:10px}.menu-btn{border:0;border-radius:15px;padding:15px 18px;text-align:left;background:#fff;box-shadow:0 7px 20px rgba(41,56,45,.1);display:flex;align-items:center;gap:14px;transition:.15s}.menu-btn:hover{transform:translateY(-1px)}.menu-btn:active{transform:translateY(1px)}.menu-btn .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#edf1e7;font-size:20px}.menu-btn b{display:block;font-size:15px}.menu-btn small{display:block;color:#77817b;font-size:10px;margin-top:2px}.menu-btn.primary{background:#1b2821;color:#fff}.menu-btn.primary .ico{background:#33483b}.menu-btn.disabled{opacity:.45;pointer-events:none}
.version{margin-top:18px;color:#89918b;font-size:9px;letter-spacing:1px}
.menu-modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(24,35,28,.32);backdrop-filter:blur(5px);z-index:5}.menu-modal-card{position:relative;width:min(360px,calc(100% - 40px));padding:24px;border-radius:20px;background:#faf9f2;box-shadow:0 20px 60px rgba(20,35,24,.25)}.menu-modal-card h3{margin:0 0 12px;font-size:20px}.menu-modal-card p{margin:7px 0;color:#69736e;font-size:12px;line-height:1.45}.modal-close{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:26px;color:#68736e}
#game{background:#91ad83}.canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.stats{display:flex;gap:7px}.card,.level,.side-panel,.buildbar,.back{background:rgba(250,249,242,.94);border:1px solid rgba(255,255,255,.65);box-shadow:0 9px 28px rgba(35,50,38,.15);backdrop-filter:blur(10px)}
.card{padding:8px 11px;border-radius:14px;min-width:88px}.card small{display:block;color:#69736e;font-size:9px}.card b{display:block;font-size:15px;margin-top:2px}.level{border-radius:14px;padding:9px 12px;text-align:right}.level b{font-size:14px}.level small{display:block;color:#69736e;font-size:9px;margin-top:2px}
.tabs{position:absolute;right:14px;top:104px;display:grid;grid-template-columns:112px 112px;gap:7px;pointer-events:auto}.tab{border:0;border-radius:12px;background:rgba(250,249,242,.94);padding:9px 10px;text-align:left;font-size:10px;box-shadow:0 7px 22px rgba(35,50,38,.12)}.tab span{font-size:16px;margin-right:5px}.tab.active{background:#1b2821;color:#fff}
.side-panel{position:absolute;right:14px;top:228px;width:235px;border-radius:16px;padding:13px;display:none;font-size:11px}.side-panel.show{display:block}.side-panel h3{margin:0 0 8px;font-size:15px}.side-panel p{margin:5px 0;color:#69736e;line-height:1.35}
.bottom{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:9px;pointer-events:none}.income{background:rgba(250,249,242,.94);border-radius:14px;padding:9px 12px;min-width:140px;box-shadow:0 8px 24px rgba(35,50,38,.14)}.income small{display:block;color:#69736e;font-size:9px}.income b{font-size:14px}.buildbar{display:flex;gap:6px;padding:7px;border-radius:15px;overflow:auto;max-width:calc(100% - 155px);pointer-events:auto}.build{border:0;background:#f0f1e9;border-radius:11px;padding:7px 9px;min-width:90px;text-align:left}.build.active{background:#1b2821;color:#fff}.build:disabled{opacity:.4}.build i{font-style:normal;font-size:18px}.build b{display:block;font-size:10px}.build small{font-size:8px;color:#758078}.build.active small{color:#d7ddd8}
.back{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top));border:0;border-radius:12px;padding:9px 12px;pointer-events:auto;font-size:11px}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);background:#1b2821;color:#fff;padding:12px 17px;border-radius:14px;opacity:0;pointer-events:none;transition:.18s;font-size:12px;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(max-width:700px){.hud{left:8px;right:8px}.stats{gap:4px}.card{min-width:72px;padding:7px 8px}.card b{font-size:12px}.level{padding:8px 9px}.tabs{right:8px;top:100px;grid-template-columns:92px 92px;gap:5px}.tab{padding:7px;font-size:9px}.bottom{left:8px;right:8px}.income{min-width:116px;padding:8px}.buildbar{max-width:calc(100% - 128px)}.build{min-width:82px}.side-panel{right:8px;top:204px;width:205px}.menu-card{padding:31px 22px 25px}.title{font-size:36px}}
</style>
</head>
<body>
<section id="menu" class="screen">
<div class="menu-bg"></div>
<div class="menu-card">
<div class="logo">MY CLICKER</div>
<h1 class="title">Город<br>с нуля</h1>
<div class="subtitle">Стройте дома. Развивайте город. Растите.</div>
<div class="menu-actions">
<button id="continueBtn" class="menu-btn primary"><div class="ico">▶️</div><div><b>Продолжить игру</b><small>Загрузить сохранённый город</small></div></button>
<button id="newBtn" class="menu-btn"><div class="ico">🏗️</div><div><b>Начать игру</b><small>Создать новый город</small></div></button>
<button id="ratingBtn" class="menu-btn"><div class="ico">🏆</div><div><b>Рейтинг</b><small>Лучшие города игроков</small></div></button>
<button id="settingsBtn" class="menu-btn"><div class="ico">⚙️</div><div><b>Настройки</b><small>Параметры игры</small></div></button>
<div id="menuModal" class="menu-modal hidden"><div class="menu-modal-card"><button id="modalClose" class="modal-close">×</button><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div>
</div>
<div class="version">HTML5 • V 0.1</div>
</div>
</section>

<section id="game" class="screen hidden">
<canvas id="canvas" class="canvas"></canvas>
<button id="backBtn" class="back">← Меню</button>
<div class="hud">
<div class="stats">
<div class="card"><small>💰 Деньги</small><b id="money">1 000</b></div>
<div class="card"><small>👥 Жители</small><b id="pop">0</b></div>
<div class="card"><small>📈 Доход</small><b id="rate">+0/сек</b></div>
</div>
<div class="level"><b id="level">Город 1</b><small id="xp">0 / 100 XP</small></div>
</div>
<div class="tabs">
<button class="tab active" data-panel="build"><span>🏗️</span>Строительство</button>
<button class="tab" data-panel="city"><span>🏙️</span>Город</button>
<button class="tab" data-panel="stats"><span>📊</span>Статистика</button>
<button class="tab" data-panel="settings"><span>⚙️</span>Настройки</button>
</div>
<div id="sidePanel" class="side-panel"></div>
<div class="bottom">
<div class="income"><small>Доход города</small><b id="income">0 монет / сек</b></div>
<div id="buildbar" class="buildbar"></div>
</div>
<div id="toast" class="toast"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d');
let W=0,H=0,D=1,cam={x:0,y:0,z:1},drag=null,selectedType='house',activePanel='build';
const TYPES={
house:{name:'Дом',icon:'🏠',cost:150,income:2,pop:12,xp:20,color:'#dfc3a3',roof:'#6d5548'},
shop:{name:'Магазин',icon:'🏪',cost:400,income:7,pop:4,xp:35,color:'#d9ae91',roof:'#725148'},
office:{name:'Офис',icon:'🏢',cost:900,income:18,pop:8,xp:60,color:'#a9c8d0',roof:'#52676d'},
park:{name:'Парк',icon:'🌳',cost:600,income:1,pop:20,xp:45,color:'#88b476',roof:'#648a5c'}
};
const plots=[[-3,-3],[0,-3],[3,-3],[-3,-1],[3,-1],[-3,1],[3,1],[-3,3],[0,3],[3,3],[-5,0],[5,0],[-5,3],[5,3]];
let state=JSON.parse(localStorage.getItem('my_clicker_save')||'null')||{money:1000,buildings:Array(14).fill(null),xp:0,level:1,totalEarned:0};
if(!Array.isArray(state.buildings)||state.buildings.length!==14)state.buildings=Array(14).fill(null);

function save(){localStorage.setItem('my_clicker_save',JSON.stringify(state))}
function fmt(n){return Math.floor(n).toLocaleString('ru-RU')}
function totals(){let income=0,pop=0;state.buildings.forEach(b=>{if(!b)return;const t=TYPES[b.type],m=1+(b.level-1)*.35;income+=t.income*m;pop+=t.pop});return{income,pop}}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);draw()}
addEventListener('resize',resize);

function iso(a,b){const s=Math.min(W/12,H/17)*cam.z;return{x:W/2+cam.x+(a-b)*s*.72,y:H/2+cam.y+(a+b)*s*.34}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function tree(x,y,k=.6){ctx.fillStyle='#6b4b38';ctx.fillRect(x-2,y+7,4,19*k);ctx.fillStyle='#4f8154';ctx.beginPath();ctx.arc(x,y,14*k,0,Math.PI*2);ctx.fill();ctx.fillStyle='#76a45f';ctx.beginPath();ctx.arc(x-7*k,y-4,9*k,0,Math.PI*2);ctx.arc(x+7*k,y-3,10*k,0,Math.PI*2);ctx.fill()}
function lamp(x,y){ctx.strokeStyle='#50483f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+16);ctx.lineTo(x,y-9);ctx.stroke();ctx.fillStyle='#f5d78b';ctx.beginPath();ctx.arc(x,y-11,5,0,Math.PI*2);ctx.fill()}
function building(x,y,type,level){
const t=TYPES[type],s=cam.z,w=type==='office'?70:type==='shop'?66:60,h=type==='office'?52:type==='shop'?43:37;
if(type==='park'){
ctx.fillStyle='rgba(32,48,32,.22)';ctx.beginPath();ctx.ellipse(x+4,y+18,w*.72,10,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#8dbb76';ctx.beginPath();ctx.ellipse(x,y+2,w*.72,h*.58,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#d9c9a9';ctx.fillRect(x-23,y+1,46,5);
tree(x,y-13,.72);tree(x-19,y+4,.45);tree(x+19,y+4,.45);return}
ctx.fillStyle='rgba(36,42,34,.25)';ctx.beginPath();ctx.ellipse(x+5,y+h*.62,w*.78,11,0,0,Math.PI*2);ctx.fill();
const left=x-w/2,right=x+w/2,top=y-h/2,bottom=y+h/2;
ctx.fillStyle=t.color;ctx.fillRect(left,top,w,h);
poly([{x:left, y:top},{x, y:top-30},{x:right,y:top}],t.roof,'#4b4038');
poly([{x:left, y:top},{x, y:top-30},{x, y:top+5}], 'rgba(255,255,255,.13)');
ctx.fillStyle=type==='office'?'#8fb7c2':'#f3d98e';
if(type==='office'){
for(let row=0;row<2;row++)for(let col=-1;col<2;col++){ctx.fillRect(x+col*19-6,top+12+row*18,12,11)}
ctx.fillStyle='#65777b';ctx.fillRect(x-7,bottom-18,14,18);
}else{
ctx.fillRect(left+13,top+15,14,12);ctx.fillRect(right-27,top+15,14,12);
ctx.fillStyle='#6a4e3d';ctx.fillRect(x-6,bottom-20,12,20);
if(type==='shop'){ctx.fillStyle='#f6f0df';ctx.fillRect(x-25,bottom-8,50,5);ctx.fillStyle='#c77d5c';for(let i=-2;i<3;i++)ctx.fillRect(x+i*10-3,bottom-8,6,5)}
}
ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(left+5,top+5,3,h-10);
ctx.font=Math.max(16,23*s)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.icon,x,y-h*.16);
if(level>1){ctx.fillStyle='#fff';ctx.font='700 10px Arial';ctx.fillText('★ '+level,x,y+h*.67)}
}
function fountain(){const q=iso(0,0),r=Math.min(W,H)*.105*cam.z;ctx.fillStyle='rgba(50,55,45,.2)';ctx.beginPath();ctx.ellipse(q.x+4,q.y+8,r*1.08,r*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c9bea9';ctx.beginPath();ctx.ellipse(q.x,q.y,r*1.08,r*.58,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#70b6c1';ctx.beginPath();ctx.ellipse(q.x,q.y,r*.82,r*.43,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f7f1e6';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#d9cfbf';ctx.beginPath();ctx.ellipse(q.x,q.y-r*.18,r*.22,r*.11,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(q.x,q.y-r*.18);ctx.quadraticCurveTo(q.x-7,q.y-r*.55,q.x,q.y-r*.7);ctx.quadraticCurveTo(q.x+7,q.y-r*.55,q.x,q.y-r*.18);ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#8eae7a';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#e8dfcc';poly([{x:35,y:30},{x:W-35,y:30},{x:W-55,y:H-30},{x:55,y:H-30}],'#e8dfcc','#cfc4ad');
const L=60,R=W-60,T=90,B=H-70,M=W/2;
function road(x1,y1,x2,y2){
ctx.strokeStyle='rgba(62,70,55,.13)';ctx.lineWidth=49*cam.z;ctx.beginPath();ctx.moveTo(x1+3,y1+4);ctx.lineTo(x2+3,y2+4);ctx.stroke();
ctx.strokeStyle='#d2c7b2';ctx.lineWidth=44*cam.z;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
road(L,T,R,T);road(L,H/2,R,H/2);road(L,B,R,B);road(L,T,L,B);road(M,T,M,B);road(R,T,R,B);
plots.forEach((v,i)=>{const q=iso(v[0],v[1]),s=Math.min(W/12,H/17)*cam.z,w=s*1.55,h=s*.73;poly([{x:q.x,y:q.y-h},{x:q.x+w,y:q.y},{x:q.x,y:q.y+h},{x:q.x-w,y:q.y}], '#b7d597','#809b69');tree(q.x-w*.58,q.y-h*.18,.42);tree(q.x+w*.58,q.y-h*.12,.38);if(state.buildings[i])building(q.x,q.y,state.buildings[i].type,state.buildings[i].level);else{ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.moveTo(q.x,q.y-h*.45);ctx.lineTo(q.x+w*.45,q.y);ctx.lineTo(q.x,q.y+h*.45);ctx.lineTo(q.x-w*.45,q.y);ctx.closePath();ctx.stroke();ctx.setLineDash([])}})
fountain();for(let i=0;i<5;i++)lamp(W*.24+i*W*.13,H*.5);for(let i=0;i<7;i++)tree(45+i*(W-90)/6,62+(i%2)*8,.62);for(let i=0;i<6;i++)tree(55+i*(W-110)/5,H-53-(i%2)*7,.62);
updateUI()}
function updateUI(){const t=totals();$('money').textContent=fmt(state.money);$('pop').textContent=fmt(t.pop);$('rate').textContent='+'+fmt(t.income)+'/сек';$('income').textContent=fmt(t.income)+' монет / сек';$('level').textContent='Город '+state.level;$('xp').textContent=fmt(state.xp)+' / '+state.level*100+' XP';renderBuildBar()}
function renderBuildBar(){const el=$('buildbar');el.innerHTML='';if(activePanel!=='build'){el.style.display='none';return}el.style.display='flex';Object.entries(TYPES).forEach(([id,t])=>{const b=document.createElement('button');b.className='build'+(id===selectedType?' active':'');b.disabled=state.money<t.cost;b.innerHTML='<i>'+t.icon+'</i><b>'+t.name+'</b><small>'+fmt(t.cost)+' 💰 · +'+t.income+'/сек</small>';b.onclick=()=>{selectedType=id;renderBuildBar()};el.appendChild(b)})}
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1300)}
function panel(name){activePanel=name;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));const p=$('sidePanel');p.classList.add('show');
if(name==='build')p.innerHTML='<h3>🏗️ Строительство</h3><p>Выберите здание снизу, затем нажмите на свободный участок.</p><p>Карту можно перемещать свайпом и масштабировать колесом мыши.</p>';
if(name==='city'){const t=totals();p.innerHTML='<h3>🏙️ Ваш город</h3><p>Уровень: <b>'+state.level+'</b></p><p>Жителей: <b>'+fmt(t.pop)+'</b></p><p>Построено: <b>'+state.buildings.filter(Boolean).length+'</b></p>'}
if(name==='stats'){const t=totals();p.innerHTML='<h3>📊 Статистика</h3><p>Доход: <b>'+fmt(t.income)+' 💰/сек</b></p><p>Зданий: <b>'+state.buildings.filter(Boolean).length+'</b></p><p>Всего заработано: <b>'+fmt(state.totalEarned)+' 💰</b></p>'}
if(name==='settings')p.innerHTML='<h3>⚙️ Настройки</h3><p>Прогресс сохраняется автоматически на устройстве.</p><button id="resetSave" style="width:100%;border:0;border-radius:10px;padding:9px;background:#1b2821;color:#fff">Сбросить прогресс</button>';
if(name==='settings')$('resetSave').onclick=()=>{if(confirm('Удалить сохранение и начать заново?')){localStorage.removeItem('my_clicker_save');location.reload()}}
renderBuildBar()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>panel(b.dataset.panel));
function openGame(load){cam={x:0,y:0,z:1};if(!load){state={money:1000,buildings:Array(14).fill(null),xp:0,level:1,totalEarned:0};save()}$('menu').classList.add('hidden');$('game').classList.remove('hidden');resize();panel('build')}
$('newBtn').onclick=()=>openGame(false);$('continueBtn').onclick=()=>openGame(true);
function showMenuModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('menuModal').classList.remove('hidden')}
$('modalClose').onclick=()=>$('menuModal').classList.add('hidden');
$('menuModal').addEventListener('click',e=>{if(e.target===$('menuModal'))$('menuModal').classList.add('hidden')});
$('ratingBtn').onclick=()=>showMenuModal('🏆 Рейтинг','<p>Локальный рейтинг пока не подключён.</p><p>Следующим этапом подключим рейтинг Яндекс Игр, чтобы здесь отображались игроки и их результаты.</p>');
$('settingsBtn').onclick=()=>showMenuModal('⚙️ Настройки','<p>Здесь будут настройки звука, графики, управления и языка.</p><p>Сейчас доступен базовый режим без дополнительных параметров.</p>');
$('backBtn').onclick=()=>{$('game').classList.add('hidden');$('menu').classList.remove('hidden')};

canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;draw()}});
canvas.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){let best=-1,bd=999;plots.forEach((v,i)=>{const q=iso(v[0],v[1]),s=Math.min(W/12,H/17)*cam.z,w=s*1.55,h=s*.73,d=Math.abs((e.clientX-q.x)/w)+Math.abs((e.clientY-q.y)/h);if(d<1&&d<bd){bd=d;best=i}});if(best>=0){const b=state.buildings[best];if(b){toast(TYPES[b.type].icon+' '+TYPES[b.type].name+' · уровень '+b.level)}else if(activePanel==='build'){const t=TYPES[selectedType];if(state.money<t.cost)toast('Не хватает денег');else{state.money-=t.cost;state.buildings[best]={type:selectedType,level:1};state.xp+=t.xp;while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;toast('🎉 Новый уровень!')}save();toast(t.icon+' '+t.name+' построен');draw()}}}}drag=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.72,Math.min(1.55,cam.z*(e.deltaY<0?1.08:.92)));draw()},{passive:false});

let last=performance.now(),lastSave=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,1);last=now;const t=totals();state.money+=t.income*dt;state.totalEarned+=t.income*dt;if(now-lastSave>2000){save();lastSave=now}if(!$('game').classList.contains('hidden'))updateUI();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(localStorage.getItem('my_clicker_save'))$('continueBtn').classList.remove('disabled');else $('continueBtn').classList.add('disabled');
</script>
</body>
</html>
