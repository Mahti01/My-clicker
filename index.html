<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мой магазин</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="menu-shell">
  <div class="brand">
    <div class="brand-mark">М</div>
    <div>
      <div class="brand-title">МОЙ МАГАЗИН</div>
      <div class="brand-subtitle">Экономический симулятор</div>
    </div>
  </div>

  <main class="menu">
    <button id="continueBtn" class="menu-button disabled" disabled>
      <span class="icon">▶</span><span>Продолжить игру</span>
    </button>
    <button id="startBtn" class="menu-button">
      <span class="icon">＋</span><span>Начать игру</span>
    </button>
    <button id="ratingBtn" class="menu-button">
      <span class="icon">🏆</span><span>Рейтинг</span>
    </button>
    <button id="settingsBtn" class="menu-button">
      <span class="icon">⚙</span><span>Настройки</span>
    </button>
  </main>

  <div class="version">Версия 0.1.0</div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
