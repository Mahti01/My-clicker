<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My Clicker — Город</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#9fbca0;color:#17221c}
button{font:inherit;cursor:pointer}body{overscroll-behavior:none}
.screen{position:fixed;inset:0}.hidden{display:none!important}
#menu{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#a9c9ae,#dfe5c9 55%,#8fae91)}
.menu-bg{position:absolute;inset:0;overflow:hidden}
.menu-bg:before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:rgba(255,255,255,.2);left:-240px;top:-250px}
.menu-bg:after{content:"";position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(72,105,74,.13);right:-190px;bottom:-210px}
.menu-card{position:relative;width:min(430px,calc(100% - 34px));padding:36px 30px 30px;background:rgba(250,249,242,.91);border:1px solid rgba(255,255,255,.7);border-radius:28px;box-shadow:0 24px 70px rgba(38,57,43,.22);backdrop-filter:blur(16px);text-align:center}
.logo{font-size:13px;letter-spacing:4px;font-weight:900;color:#657a64;margin-bottom:10px}.title{font-size:42px;line-height:.95;font-weight:900;letter-spacing:-2px;margin:0}.subtitle{color:#66716a;font-size:13px;margin:12px 0 27px}
.menu-actions{display:grid;gap:10px}.menu-btn{border:0;border-radius:15px;padding:15px 18px;text-align:left;background:#fff;box-shadow:0 7px 20px rgba(41,56,45,.1);display:flex;align-items:center;gap:14px;transition:.15s}.menu-btn:hover{transform:translateY(-1px)}.menu-btn:active{transform:translateY(1px)}.menu-btn .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#edf1e7;font-size:20px}.menu-btn b{display:block;font-size:15px}.menu-btn small{display:block;color:#77817b;font-size:10px;margin-top:2px}.menu-btn.primary{background:#1b2821;color:#fff}.menu-btn.primary .ico{background:#33483b}.menu-btn.disabled{opacity:.45;pointer-events:none}
.version{margin-top:18px;color:#89918b;font-size:9px;letter-spacing:1px}
.menu-modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(24,35,28,.32);backdrop-filter:blur(5px);z-index:5}.menu-modal-card{position:relative;width:min(360px,calc(100% - 40px));padding:24px;border-radius:20px;background:#faf9f2;box-shadow:0 20px 60px rgba(20,35,24,.25)}.menu-modal-card h3{margin:0 0 12px;font-size:20px}.menu-modal-card p{margin:7px 0;color:#69736e;font-size:12px;line-height:1.45}.modal-close{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:26px;color:#68736e}
#game{background:#91ad83}.canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
.hud{position:absolute;z-index:10;pointer-events:none;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.stats{display:flex;gap:7px}.card,.level,.side-panel,.buildbar,.back{background:rgba(250,249,242,.94);border:1px solid rgba(255,255,255,.65);box-shadow:0 9px 28px rgba(35,50,38,.15);backdrop-filter:blur(10px)}
.card{padding:8px 11px;border-radius:14px;min-width:88px}.card small{display:block;color:#69736e;font-size:9px}.card b{display:block;font-size:15px;margin-top:2px}.level{border-radius:14px;padding:9px 12px;text-align:right}.level b{font-size:14px}.level small{display:block;color:#69736e;font-size:9px;margin-top:2px}
.tabs{position:absolute;z-index:100;right:14px;top:104px;display:flex;flex-direction:column;gap:7px;pointer-events:auto;touch-action:manipulation;width:112px}.tab{position:relative;z-index:101;box-sizing:border-box;border:0;border-radius:12px;background:rgba(250,249,242,.96);padding:8px 8px;text-align:left;font-size:9.5px;line-height:1;box-shadow:0 7px 22px rgba(35,50,38,.12);width:112px;min-height:44px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}.tab span{display:inline-flex;flex:0 0 20px;width:20px;font-size:15px;margin-right:3px;align-items:center;justify-content:center}.tab.active{background:#1b2821;color:#fff}
.side-panel{position:absolute;z-index:1000;left:14px;right:auto;top:104px;width:min(185px,calc(100vw - 150px));box-sizing:border-box;border-radius:14px;padding:11px 12px;background:rgba(250,249,242,.97);box-shadow:0 10px 28px rgba(35,50,38,.16);display:none;font-size:10px;line-height:1.25;pointer-events:auto;touch-action:auto}.side-panel.show{display:block}.panel-close{position:absolute;right:8px;top:7px;width:24px;height:24px;border:0;border-radius:8px;background:#edf0e8;color:#5f6963;font-size:17px;line-height:24px;padding:0}.panel-close{pointer-events:auto;touch-action:manipulation;z-index:5;cursor:pointer}.panel-close:active{transform:scale(.94)}.side-panel h3{margin:0 26px 7px 0;font-size:13px;line-height:1.15}.side-panel p{margin:5px 0;color:#69736e;line-height:1.3}
.bottom{position:absolute;z-index:20;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:9px;pointer-events:none}.income{background:rgba(250,249,242,.94);border-radius:14px;padding:9px 12px;min-width:140px;box-shadow:0 8px 24px rgba(35,50,38,.14)}.income small{display:block;color:#69736e;font-size:9px}.income b{font-size:14px}.buildbar{display:flex;gap:6px;padding:7px;border-radius:15px;overflow:auto;max-width:calc(100% - 155px);pointer-events:auto}.build{border:0;background:#f0f1e9;border-radius:11px;padding:7px 9px;min-width:90px;text-align:left}.build.active{background:#1b2821;color:#fff}.build:disabled{opacity:.4}.build i{font-style:normal;font-size:18px}.build b{display:block;font-size:10px}.build small{font-size:8px;color:#758078}.build.active small{color:#d7ddd8}
.back{position:absolute;z-index:30;left:14px;top:calc(max(14px,env(safe-area-inset-top)) + 68px);border:0;border-radius:12px;padding:9px 12px;pointer-events:auto;font-size:11px}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);background:#1b2821;color:#fff;padding:12px 17px;border-radius:14px;opacity:0;pointer-events:none;transition:.18s;font-size:12px;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(max-width:700px){.hud{left:8px;right:8px}.stats{gap:4px}.card{min-width:72px;padding:7px 8px}.card b{font-size:12px}.level{padding:8px 9px}.tabs{right:8px;top:100px;grid-template-columns:92px 92px;gap:5px}.tab{padding:7px;font-size:9px}.bottom{left:8px;right:8px}.income{min-width:116px;padding:8px}.buildbar{max-width:calc(100% - 128px)}.build{min-width:82px}.side-panel{right:8px;top:204px;width:205px}.menu-card{padding:31px 22px 25px}.title{font-size:36px}}
</style>
</head>
<body>
<section id="menu" class="screen">
<div class="menu-bg"></div>
<div class="menu-card">
<div class="logo">MY CLICKER</div>
<h1 class="title">Город<br>с нуля</h1>
<div class="subtitle">Стройте дома. Развивайте город. Растите.</div>
<div class="menu-actions">
<button id="continueBtn" class="menu-btn primary"><div class="ico">▶️</div><div><b>Продолжить игру</b><small>Загрузить сохранённый город</small></div></button>
<button id="newBtn" class="menu-btn"><div class="ico">🏗️</div><div><b>Начать игру</b><small>Создать новый город</small></div></button>
<button id="ratingBtn" class="menu-btn"><div class="ico">🏆</div><div><b>Рейтинг</b><small>Лучшие города игроков</small></div></button>
<button id="settingsBtn" class="menu-btn"><div class="ico">⚙️</div><div><b>Настройки</b><small>Параметры игры</small></div></button>
<div id="menuModal" class="menu-modal hidden"><div class="menu-modal-card"><button id="modalClose" class="modal-close">×</button><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div>
</div>
<div class="version">HTML5 • V 0.1</div>
</div>
</section>

<section id="game" class="screen hidden">
<canvas id="canvas" class="canvas"></canvas>
<button id="backBtn" class="back">← Меню</button>
<div class="hud">
<div class="stats">
<div class="card"><small>💰 Деньги</small><b id="menuMoney">1 000</b></div>
<div class="card"><small>👥 Жители</small><b id="menuPop">0</b></div>
<div class="card"><small>📈 Доход</small><b id="rate">+0/сек</b></div>
</div>
<div class="level"><b id="level">Город 1</b><small id="xp">0 / 100 XP</small></div>
</div>
<div class="tabs">
<button class="tab active" data-panel="build"><span>🏗️</span>Строительство</button>
<button class="tab" data-panel="city"><span>🏙️</span>Город</button>
<button class="tab" data-panel="stats"><span>📊</span>Статистика</button>
<button class="tab" data-panel="settings"><span>⚙️</span>Настройки</button>
</div>
<div id="sidePanel" class="side-panel"></div>
<div class="bottom">
<div class="income"><small>Доход города</small><b id="income">0 монет / сек</b><small id="incomeTimer" style="margin-top:3px;color:#879089">Экономика работает в реальном времени</small></div>
<div id="buildbar" class="buildbar"></div>
</div>
<div id="toast" class="toast"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d');
let W=0,H=0,D=1,cam={x:0,y:0,z:1},drag=null,selectedType='house',activePanel='build';
const TYPES={
house:{name:'Дом',icon:'🏠',cost:150,income:2,pop:12,xp:20,color:'#dfc3a3',roof:'#6d5548'},
shop:{name:'Магазин',icon:'🏪',cost:400,income:7,pop:4,xp:35,color:'#d9ae91',roof:'#725148'},
office:{name:'Офис',icon:'🏢',cost:900,income:18,pop:8,xp:60,color:'#a9c8d0',roof:'#52676d'},
park:{name:'Парк',icon:'🌳',cost:600,income:1,pop:20,xp:45,color:'#88b476',roof:'#648a5c'}
};
const plots=[[-6,-6],[-3,-6],[0,-6],[3,-6],[6,-6],[-6,-3],[-3,-3],[0,-3],[3,-3],[6,-3],[-6,0],[-3,0],[3,0],[6,0],[-6,3],[-3,3],[0,3],[3,3],[6,3],[-6,6],[-3,6],[0,6],[3,6],[6,6]];
let state=JSON.parse(localStorage.getItem('my_clicker_save')||'null')||{money:1000,buildings:Array(25).fill(null),xp:0,level:1,totalEarned:0};
if(!Array.isArray(state.buildings)||state.buildings.length!==25)state.buildings=Array(25).fill(null);

function save(){localStorage.setItem('my_clicker_save',JSON.stringify(state))}
function fmt(n){return Math.floor(n).toLocaleString('ru-RU')}
function totals(){let income=0,pop=0;state.buildings.forEach(b=>{if(!b)return;const t=TYPES[b.type],m=1+(b.level-1)*.35;income+=t.income*m;pop+=t.pop});const cityBonus=1+Math.min(.25,pop/800);return{income:income*cityBonus,pop,baseIncome:income,cityBonus}}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);draw()}
addEventListener('resize',resize);

function clampCam(){const zx=Math.max(24,W*.30*(cam.z-.72)+W*.08),zy=Math.max(20,H*.24*(cam.z-.72)+H*.07);cam.x=Math.max(-zx,Math.min(zx,cam.x));cam.y=Math.max(-zy,Math.min(zy,cam.y))}
function iso(a,b){const s=Math.min(W/16,H/22);return{x:W/2+(a-b)*s*.72,y:H/2+(a+b)*s*.34}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function tree(x,y,k=.6){ctx.fillStyle='#6b4b38';ctx.fillRect(x-2,y+7,4,19*k);ctx.fillStyle='#4f8154';ctx.beginPath();ctx.arc(x,y,14*k,0,Math.PI*2);ctx.fill();ctx.fillStyle='#76a45f';ctx.beginPath();ctx.arc(x-7*k,y-4,9*k,0,Math.PI*2);ctx.arc(x+7*k,y-3,10*k,0,Math.PI*2);ctx.fill()}
function lamp(x,y){ctx.strokeStyle='#50483f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+16);ctx.lineTo(x,y-9);ctx.stroke();ctx.fillStyle='#f5d78b';ctx.beginPath();ctx.arc(x,y-11,5,0,Math.PI*2);ctx.fill()}
function building(x,y,type,level){
 const t=TYPES[type];
 const cellS=Math.min(W/16,H/22);
 const lotW=cellS*2.05, lotH=cellS*.9;
 if(type==='park'){
  const w=lotW*.72,h=lotH*.58;
  ctx.fillStyle='rgba(36,48,36,.22)';ctx.beginPath();ctx.ellipse(x+3,y+h*.42,w*.52,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#91bb78';ctx.beginPath();ctx.ellipse(x,y,w*.52,h*.5,0,0,Math.PI*2);ctx.fill();
  tree(x-w*.22,y-h*.2,.38);tree(x,y-h*.28,.42);tree(x+w*.22,y-h*.18,.36);
  ctx.fillStyle='#d8c9aa';ctx.fillRect(x-w*.3,y+h*.08,w*.6,3);return;
 }
 if(type==='house'){
  const variants=[
   {wall:'#d9b09d',roof:'#6c625c',trim:'#f6ead9'},
   {wall:'#b8c8c8',roof:'#555b5d',trim:'#f0eee6'},
   {wall:'#d7c6a8',roof:'#746c60',trim:'#fff4df'},
   {wall:'#c9b4a1',roof:'#4e5658',trim:'#f3e7d7'}
  ];
  const v=variants[level%variants.length];
  const w=lotW*.66,h=lotH*.52, roofH=lotH*.42;
  const left=x-w/2,right=x+w/2,base=y+h/2,top=y-h/2;
  ctx.fillStyle='rgba(37,45,37,.22)';ctx.beginPath();ctx.ellipse(x+2,y+h*.48,w*.48,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8fba75';ctx.beginPath();ctx.ellipse(x,y+h*.43,w*.54,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=v.wall;ctx.fillRect(left,top,w,h);
  poly([{x:left-2,y:top+1},{x,y:top-roofH},{x:right+2,y:top+1}],v.roof,'#403d3a');
  poly([{x:left,y:top+1},{x,y:top-roofH},{x,y:top+4}], 'rgba(255,255,255,.13)');
  ctx.fillStyle=v.trim;ctx.fillRect(x-w*.43,base-6,w*.30,5);
  ctx.fillStyle='#8a6a52';ctx.fillRect(x-w*.39,base-18,2,16);ctx.fillRect(x-w*.12,base-18,2,16);
  ctx.fillStyle='#795d4d';ctx.fillRect(x-w*.07,base-21,7,21);
  ctx.fillStyle='#d9b66f';ctx.beginPath();ctx.arc(x+w*.035,base-11,1.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#9dc7d0';
  for(const wx of [x-w*.31,x+w*.19]){
   ctx.fillRect(wx,top+11,9,7);ctx.strokeStyle=v.trim;ctx.lineWidth=1;ctx.strokeRect(wx,top+11,9,7);
   ctx.beginPath();ctx.moveTo(wx+4.5,top+11);ctx.lineTo(wx+4.5,top+18);ctx.stroke();
  }
  if(level>=2){
   ctx.fillStyle='#b8b4a9';ctx.fillRect(x+w*.24,base-20,w*.24,20);
   ctx.strokeStyle='#716e69';ctx.lineWidth=1;ctx.strokeRect(x+w*.24,base-20,w*.24,20);
  }
  ctx.fillStyle='#765f55';ctx.fillRect(x+w*.20,top-roofH+3,4,12);
  tree(left+4,base+1,.22);tree(right-4,base+1,.21);
  return;
 }
 const w=lotW*.68,h=lotH*.55,roofH=lotH*.34;
 ctx.fillStyle='rgba(36,42,34,.22)';ctx.beginPath();ctx.ellipse(x+3,y+h*.48,w*.5,5,0,0,Math.PI*2);ctx.fill();
 const left=x-w/2,right=x+w/2,top=y-h/2,bottom=y+h/2;
 ctx.fillStyle=t.color;ctx.fillRect(left,top,w,h);
 poly([{x:left,y:top},{x,y:top-roofH},{x:right,y:top}],t.roof,'#4b4038');
 if(type==='office'){
  ctx.fillStyle='#8fb7c2';
  for(let row=0;row<2;row++)for(let col=-1;col<2;col++)ctx.fillRect(x+col*10-3,top+6+row*8,6,5);
  ctx.fillStyle='#65777b';ctx.fillRect(x-4,bottom-12,8,12);
 }else{
  ctx.fillStyle='#f3d98e';ctx.fillRect(left+7,top+8,8,7);ctx.fillRect(right-15,top+8,8,7);
  ctx.fillStyle='#6a4e3d';ctx.fillRect(x-4,bottom-14,8,14);
  if(type==='shop'){ctx.fillStyle='#f6f0df';ctx.fillRect(x-14,bottom-6,28,3)}
 }
 if(level>1){ctx.fillStyle='#fff';ctx.font='700 8px Arial';ctx.textAlign='center';ctx.fillText('★ '+level,x,y+h*.55)}
}
function fountain(){const q=iso(0,0),r=Math.min(W,H)*.105;ctx.fillStyle='rgba(50,55,45,.2)';ctx.beginPath();ctx.ellipse(q.x+4,q.y+8,r*1.08,r*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c9bea9';ctx.beginPath();ctx.ellipse(q.x,q.y,r*1.08,r*.58,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#70b6c1';ctx.beginPath();ctx.ellipse(q.x,q.y,r*.82,r*.43,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f7f1e6';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#d9cfbf';ctx.beginPath();ctx.ellipse(q.x,q.y-r*.18,r*.22,r*.11,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(q.x,q.y-r*.18);ctx.quadraticCurveTo(q.x-7,q.y-r*.55,q.x,q.y-r*.7);ctx.quadraticCurveTo(q.x+7,q.y-r*.55,q.x,q.y-r*.18);ctx.stroke()}
function drawDistrictDecor(){
  const roads=[[-6,-6,6,-6],[-6,-3,6,-3],[-6,0,6,0],[-6,3,6,3],[-6,6,6,6],[-6,-6,-6,6],[-3,-6,-3,6],[0,-6,0,6],[3,-6,3,6],[6,-6,6,6]];
  ctx.save();
  roads.forEach(r=>{
    const a=iso(r[0],r[1]),b=iso(r[2],r[3]);
    ctx.strokeStyle='rgba(62,70,55,.16)';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(a.x,a.y+9);ctx.lineTo(b.x,b.y+9);ctx.stroke();
    ctx.strokeStyle='#eee4cf';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(a.x,a.y+7);ctx.lineTo(b.x,b.y+7);ctx.stroke();
  });
  for(let i=0;i<16;i++){
    const gx=-5.5+(i%8)*1.55,gy=-5.4+Math.floor(i/8)*10;
    const p=iso(gx,gy);
    ctx.fillStyle='#8b7658';ctx.fillRect(p.x-2,p.y-12,4,12);
    ctx.fillStyle='#d7c9a5';ctx.beginPath();ctx.arc(p.x,p.y-15,5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function draw(){
ctx.clearRect(0,0,W,H);clampCam();
ctx.fillStyle='#7fa36f';ctx.fillRect(0,0,W,H);

ctx.save();
ctx.translate(W/2+cam.x,H/2+cam.y);ctx.scale(cam.z,cam.z);ctx.translate(-W/2,-H/2);

const s=Math.min(W/16,H/22), roadW=Math.max(18,s*.62);
function worldLine(a,b,c,d,width,color){
  const p=iso(a,b),q=iso(c,d);
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(p.x,p.y+8);ctx.lineTo(q.x,q.y+8);ctx.stroke();
}
function street(a,b,c,d){
  worldLine(a,b,c,d,roadW+8,'rgba(47,58,49,.20)');
  worldLine(a,b,c,d,roadW,'#4f5c58');
  worldLine(a,b,c,d,roadW-5,'#56635f');
  const p=iso(a,b),q=iso(c,d);
  ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=2;ctx.setLineDash([10,12]);
  ctx.beginPath();ctx.moveTo(p.x,p.y+8);ctx.lineTo(q.x,q.y+8);ctx.stroke();ctx.setLineDash([]);
}
function sidewalk(a,b,c,d){
  worldLine(a,b,c,d,roadW+18,'rgba(238,232,214,.95)');
  worldLine(a,b,c,d,roadW+10,'#d8cfb8');
}
const grid=[-7.5,-4.5,-1.5,1.5,4.5,7.5];
grid.forEach(v=>{sidewalk(-7.5,v,7.5,v);sidewalk(v,-7.5,v,7.5)});
grid.forEach(v=>{street(-7.5,v,7.5,v);street(v,-7.5,v,7.5)});

function crosswalk(x,y,horizontal=true){
 const p=iso(x,y);
 ctx.save();ctx.strokeStyle='#f7f2e7';ctx.lineWidth=4;ctx.setLineDash([]);
 for(let i=-2;i<=2;i++){
   ctx.beginPath();
   if(horizontal){ctx.moveTo(p.x+i*8,p.y-10);ctx.lineTo(p.x+i*8+5,p.y+10)}
   else{ctx.moveTo(p.x-10,p.y+i*5);ctx.lineTo(p.x+10,p.y+i*5+5)}
   ctx.stroke();
 }
 ctx.restore();
}
grid.slice(1,-1).forEach(v=>{crosswalk(v,-1.5);crosswalk(v,1.5);crosswalk(-1.5,v,false);crosswalk(1.5,v,false)});

function movingCar(a,b,c,d,phase,color){
 const speed=.34, u=((animTime*speed+phase)%1);
 const x=a+(c-a)*u, y=b+(d-b)*u;
 const p=iso(x,y), q=iso(x+.12,y+.12);
 const ang=Math.atan2(q.y-p.y,q.x-p.x);
 ctx.save();ctx.translate(p.x,p.y+4);ctx.rotate(ang);
 ctx.fillStyle='rgba(30,35,33,.22)';ctx.beginPath();ctx.ellipse(0,5,10,3,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=color;ctx.fillRect(-8,-4,16,7);
 ctx.fillStyle='#b8d5d8';ctx.fillRect(-4,-6,8,3);
 ctx.fillStyle='#2e3432';ctx.fillRect(-6,3,3,2);ctx.fillRect(3,3,3,2);
 ctx.restore();
}
function pedestrians(){
 const people=[[-6,-2,.05],[-2,2,.35],[3,-1,.62],[6,2,.82]];
 people.forEach(([a,b,phase])=>{
   const u=(animTime*.12+phase)%1;
   const x=a+Math.sin(u*Math.PI*2)*.12,y=b+u*.55;
   const p=iso(x,y);
   ctx.fillStyle='#d9a078';ctx.beginPath();ctx.arc(p.x,p.y-7,2.2,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#3e4c45';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y-4);ctx.lineTo(p.x,p.y+2);ctx.stroke();
 });
}
movingCar(-7,-4.5,7,-4.5,0,'#c9574d');
movingCar(7,1.5,-7,1.5,.45,'#4d78b8');
movingCar(-4.5,-7,-4.5,7,.2,'#d5a84e');
movingCar(1.5,7,1.5,-7,.7,'#f1f0e7');
pedestrians();

function plotCard(v,i){
 const q=iso(v[0],v[1]),w=s*2.05,h=s*.9;
 poly([{x:q.x,y:q.y-h},{x:q.x+w,y:q.y},{x:q.x,y:q.y+h},{x:q.x-w,y:q.y}], '#a8cc8b','#789766');
 ctx.fillStyle='rgba(255,255,255,.18)';
 ctx.beginPath();ctx.ellipse(q.x,q.y+3,w*.72,h*.36,0,0,Math.PI*2);ctx.fill();

 // driveway from the lot to the nearest street
 const roadPoint=iso(v[0],v[1]+1.5);
 ctx.strokeStyle='rgba(50,58,48,.16)';ctx.lineWidth=13;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(q.x,q.y+7);ctx.lineTo(roadPoint.x,roadPoint.y+7);ctx.stroke();
 ctx.strokeStyle='#d9d0bc';ctx.lineWidth=9;
 ctx.beginPath();ctx.moveTo(q.x,q.y+6);ctx.lineTo(roadPoint.x,roadPoint.y+6);ctx.stroke();

 // small yard path
 ctx.strokeStyle='#cfc3aa';ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(q.x,q.y+4);ctx.lineTo(q.x,roadPoint.y-2);ctx.stroke();

 tree(q.x-w*.58,q.y-h*.18,.30);tree(q.x+w*.58,q.y-h*.10,.30);

 if(state.buildings[i]){
   building(q.x,q.y,state.buildings[i].type,state.buildings[i].level);
   // mailbox
   ctx.fillStyle='#795f4e';ctx.fillRect(q.x+w*.50,q.y+h*.18,2,7);
   ctx.fillStyle='#c9b98f';ctx.fillRect(q.x+w*.48,q.y+h*.12,7,4);
   // parked car on some developed lots
   if(i%3===0){
     ctx.save();ctx.translate(q.x+w*.32,q.y+h*.22);ctx.rotate(-.08);
     ctx.fillStyle='rgba(45,52,48,.28)';ctx.fillRect(-11,4,22,5);
     ctx.fillStyle='#b94f46';ctx.fillRect(-10,-1,20,7);
     ctx.fillStyle='#b9d2d5';ctx.fillRect(-5,-4,10,4);
     ctx.fillStyle='#303735';ctx.beginPath();ctx.arc(-6,6,2.5,0,Math.PI*2);ctx.arc(6,6,2.5,0,Math.PI*2);ctx.fill();
     ctx.restore();
   }
 }else{
   ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(q.x,q.y-h*.48);ctx.lineTo(q.x+w*.48,q.y);ctx.lineTo(q.x,q.y+h*.48);ctx.lineTo(q.x-w*.48,q.y);ctx.closePath();ctx.stroke();ctx.setLineDash([]);
 }
}
plots.forEach(plotCard);

function treeCluster(x,y,n,scale){
 for(let i=0;i<n;i++) tree(x+(i-n/2)*18,y+(i%2)*8,scale*(.9+(i%3)*.08));
}
treeCluster(52,105,4,.55);treeCluster(W-55,108,4,.55);
treeCluster(48,H-115,5,.58);treeCluster(W-50,H-118,5,.58);

 const p=iso(-7.1+i*2.0,-7.05);
 lamp(p.x,p.y+4);
}
for(let i=0;i<8;i++){
 const p=iso(7.05,-7.1+i*2.0);
 lamp(p.x,p.y+4);
}

fountain();
ctx.restore();updateUI()}
function updateUI(){const t=totals();$('menuMoney').textContent=fmt(state.money);$('menuPop').textContent=fmt(t.pop);$('rate').textContent='+'+fmt(t.income)+'/сек';$('income').textContent=fmt(t.income)+' монет / сек';$('level').textContent='Город '+state.level;$('xp').textContent=fmt(state.xp)+' / '+state.level*100+' XP';renderBuildBar()}
function renderBuildBar(){const el=$('buildbar');el.innerHTML='';if(activePanel!=='build'){el.style.display='none';return}el.style.display='flex';Object.entries(TYPES).forEach(([id,t])=>{const b=document.createElement('button');b.className='build'+(id===selectedType?' active':'');b.disabled=state.money<t.cost;b.innerHTML='<i>'+t.icon+'</i><b>'+t.name+'</b><small>'+fmt(t.cost)+' 💰 · +'+t.income+'/сек</small>';b.onclick=()=>{selectedType=id;renderBuildBar()};el.appendChild(b)})}
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1300)}
function upgradeCost(b){return Math.floor(TYPES[b.type].cost*(1.65**b.level))}
function closeSidePanel(e){if(e){e.preventDefault();e.stopPropagation()}const p=$('sidePanel');p.classList.remove('show');p.style.display='none';}
function showBuildingPanel(index){
  const b=state.buildings[index],t=TYPES[b.type],p=$('sidePanel');
  activePanel='build';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.panel==='build'));
  p.classList.add('show');p.style.display='block';
  const cost=upgradeCost(b),nextMult=1+(b.level)*.35;
  p.innerHTML='<button type="button" class="panel-close" aria-label="Закрыть" onclick="closeSidePanel(event)" ontouchend="closeSidePanel(event)">×</button>'+
    '<h3>'+t.icon+' '+t.name+'</h3>'+
    '<p>Уровень: <b>'+b.level+'</b> / 10</p>'+
    '<p>Доход: <b>+'+fmt(t.income*(1+(b.level-1)*.35))+' 💰/сек</b></p>'+
    '<p>Жители: <b>+'+fmt(t.pop)+' 👥</b></p>'+
    (b.level<10?'<button id="upgradeBuilding" style="width:100%;border:0;border-radius:10px;padding:9px;background:#1b2821;color:#fff;margin-top:4px">⬆️ Улучшить · '+fmt(cost)+' 💰</button>':'<p><b>Максимальный уровень</b></p>');
  p.querySelector('.panel-close').onclick=closeSidePanel;
  const btn=$('upgradeBuilding');
  if(btn){btn.disabled=state.money<cost;btn.style.opacity=state.money<cost?'.5':'1';btn.onclick=()=>{
    if(state.money<cost)return toast('Не хватает денег');
    state.money-=cost;b.level++;state.xp+=Math.floor(t.xp*.5);
    while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;toast('🎉 Новый уровень!')}
    save();toast('⬆️ '+t.name+' улучшен до '+b.level+' уровня');showBuildingPanel(index);draw();
  }}
  renderBuildBar();
}
function panel(name){activePanel=name;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));const p=$('sidePanel');p.classList.add('show');p.style.display='block';p.style.display='block';
if(name==='build')p.innerHTML='<h3>🏗️ Строительство</h3><p>Выберите здание снизу, затем нажмите на свободный участок.</p><p>Чем больше жителей, тем выше бонус к доходу города.</p><p>Карту можно перемещать свайпом. Масштабирование: двумя пальцами.</p>';
if(name==='city'){const t=totals();const next=state.level*100-state.xp;p.innerHTML='<h3>🏙️ Ваш город</h3><p>Уровень: <b>'+state.level+'</b></p><p>Жителей: <b>'+fmt(t.pop)+'</b></p><p>Построено: <b>'+state.buildings.filter(Boolean).length+' / '+plots.length+'</b></p><p>Бонус города: <b>+'+Math.round((t.cityBonus-1)*100)+'%</b></p><p>До следующего уровня: <b>'+fmt(next)+' XP</b></p>'}
if(name==='stats'){const t=totals();p.innerHTML='<h3>📊 Статистика</h3><p>Базовый доход: <b>'+fmt(t.baseIncome)+' 💰/сек</b></p><p>Бонус жителей: <b>+'+Math.round((t.cityBonus-1)*100)+'%</b></p><p>Итоговый доход: <b>'+fmt(t.income)+' 💰/сек</b></p><p>Жителей: <b>'+fmt(t.pop)+'</b></p><p>Зданий: <b>'+state.buildings.filter(Boolean).length+'</b></p><p>Всего заработано: <b>'+fmt(state.totalEarned)+' 💰</b></p>'}
if(name==='settings')p.innerHTML='<h3>⚙️ Настройки</h3><p>Прогресс сохраняется автоматически на устройстве.</p><button id="resetSave" style="width:100%;border:0;border-radius:10px;padding:9px;background:#1b2821;color:#fff">Сбросить прогресс</button>';
if(name==='settings')$('resetSave').onclick=()=>{if(confirm('Удалить сохранение и начать заново?')){localStorage.removeItem('my_clicker_save');location.reload()}};p.insertAdjacentHTML('afterbegin','<button type="button" class="panel-close" aria-label="Закрыть">×</button>');
renderBuildBar()}
document.addEventListener('pointerdown',e=>{
  const close=e.target.closest && e.target.closest('.panel-close');
  if(close){
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    const p=$('sidePanel');
    p.classList.remove('show');
    p.style.display='none';
  }
},true);
document.addEventListener('click',e=>{
  const close=e.target.closest && e.target.closest('.panel-close');
  if(close){
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    const p=$('sidePanel');
    p.classList.remove('show');
    p.style.display='none';
  }
},true);
document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('pointerdown',e=>e.stopPropagation());
  b.addEventListener('pointerup',e=>{e.stopPropagation();panel(b.dataset.panel)});
  b.addEventListener('click',e=>{e.stopPropagation();panel(b.dataset.panel)});
});
function openGame(load){cam={x:0,y:0,z:1};if(!load){state={money:1000,buildings:Array(25).fill(null),xp:0,level:1,totalEarned:0};save()}$('menu').classList.add('hidden');$('game').classList.remove('hidden');resize();panel('build')}
$('newBtn').onclick=()=>openGame(false);$('continueBtn').onclick=()=>openGame(true);
function showMenuModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('menuModal').classList.remove('hidden')}
$('modalClose').onclick=()=>$('menuModal').classList.add('hidden');
$('menuModal').addEventListener('click',e=>{if(e.target===$('menuModal'))$('menuModal').classList.add('hidden')});
$('ratingBtn').onclick=()=>showMenuModal('🏆 Рейтинг','<p>Локальный рейтинг пока не подключён.</p><p>Следующим этапом подключим рейтинг Яндекс Игр, чтобы здесь отображались игроки и их результаты.</p>');
$('settingsBtn').onclick=()=>showMenuModal('⚙️ Настройки','<p>Здесь будут настройки звука, графики, управления и языка.</p><p>Сейчас доступен базовый режим без дополнительных параметров.</p>');
$('backBtn').onclick=()=>{$('game').classList.add('hidden');$('menu').classList.remove('hidden')};

let pointers=new Map(),pinchStart=null;
canvas.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};canvas.setPointerCapture?.(e.pointerId)}
  if(pointers.size===2){const a=[...pointers.values()];pinchStart={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom:cam.z};drag=null}
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2&&pinchStart){
    const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    cam.z=Math.max(.72,Math.min(1.55,pinchStart.zoom*(dist/pinchStart.dist)));clampCam();draw();return;
  }
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>6)drag.moved=true;
  if(drag.moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;clampCam();draw()}
});
function finishPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchStart=null;
  if(!drag)return;
  if(!drag.moved){
    let best=-1,bd=999;
    plots.forEach((v,i)=>{const q=iso(v[0],v[1]),s=Math.min(W/12,H/17),w=s*1.55,h=s*.73,d=Math.abs((e.clientX-q.x)/w)+Math.abs((e.clientY-q.y)/h);if(d<1&&d<bd){bd=d;best=i}});
    if(best>=0){
      const b=state.buildings[best];
      if(b)showBuildingPanel(best);
      else if(activePanel==='build'){
        const t=TYPES[selectedType];
        if(state.money<t.cost)toast('Не хватает денег');
        else{
          state.money-=t.cost;state.buildings[best]={type:selectedType,level:1};state.xp+=t.xp;
          while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;toast('🎉 Новый уровень!')}
          save();toast(t.icon+' '+t.name+' построен');draw()
        }
      }
    }
  }
  drag=null;
}
canvas.addEventListener('pointerup',finishPointer);
canvas.addEventListener('pointercancel',finishPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.72,Math.min(1.55,cam.z*(e.deltaY<0?1.08:.92)));clampCam();draw()},{passive:false});

let animTime=0;
let last=performance.now();
let lastSave=performance.now();
let economyTime=performance.now();
function loop(now){
  const frameDt=Math.min((now-last)/1000,1);
  last=now;
  animTime+=frameDt;

  // Экономика работает по реальному прошедшему времени, независимо от FPS анимации.
  const economyDt=Math.min(Math.max((now-economyTime)/1000,0),1);
  economyTime=now;
  const t=totals();
  if(economyDt>0 && t.income>0){
    state.money+=t.income*economyDt;
    state.totalEarned+=t.income*economyDt;
  }

  if(now-lastSave>2000){
    save();
    lastSave=now;
  }

  if(!$('game').classList.contains('hidden')){
    updateUI();
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if(localStorage.getItem('my_clicker_save'))$('continueBtn').classList.remove('disabled');else $('continueBtn').classList.add('disabled');
</script>
