<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Город — HTML5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9cfd9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.cards{display:flex;gap:8px}.card,.level,.panel button,.buildbar,.info{background:rgba(255,255,255,.95);border:1px solid rgba(40,55,45,.07);box-shadow:0 8px 24px rgba(42,54,46,.16);border-radius:17px}
.card{min-width:100px;padding:9px 12px}.label{font-size:12px;color:#69736f}.value{font-size:19px;font-weight:800;margin-top:3px}.level{padding:10px 14px;min-width:116px}.level b{font-size:18px;display:block}.level span{font-size:12px;color:#6e7773}
.panel{position:absolute;right:14px;top:105px;display:grid;grid-template-columns:145px 145px;gap:8px}.panel button{height:56px;border:0;color:#3783d2;font-weight:600;font-size:15px}.panel button.active{background:#19241f;color:#fff}
.buildbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;max-width:calc(100% - 28px);overflow:auto}
.buildbar button{flex:0 0 auto;border:0;background:#f7f5ef;border-radius:13px;padding:8px 11px;font-size:12px;color:#28312d}.buildbar button b{display:block;font-size:18px}.buildbar button.selected{background:#26342d;color:#fff}
.info{position:absolute;left:14px;bottom:14px;padding:10px 14px;min-width:150px}.info small{display:block;color:#707a76;font-size:12px}.info strong{font-size:18px}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);background:rgba(25,36,31,.94);color:#fff;padding:13px 18px;border-radius:15px;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.citybox{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.96);border-radius:17px;padding:12px 14px;box-shadow:0 8px 24px rgba(42,54,46,.16);display:none}.citybox b{font-size:16px}.citybox div{font-size:12px;color:#69736f;margin-top:4px}
@media(max-width:700px){.card{min-width:0;width:100px;padding:8px 9px}.value{font-size:18px}.panel{right:9px;top:104px;grid-template-columns:135px 135px}.panel button{height:53px;font-size:14px}.buildbar{bottom:10px}.info{bottom:10px}.level{padding:9px 11px}}
</style>
</head>
<body><div id="app">
<canvas id="c"></canvas>
<div class="hud"><div class="cards">
<div class="card"><div class="label">💰 Деньги</div><div class="value" id="money">1 000</div></div>
<div class="card"><div class="label">👥 Жители</div><div class="value" id="pop">0</div></div>
<div class="card"><div class="label">📈 Доход</div><div class="value" id="rate">+0/сек</div></div>
</div><div class="level"><b id="level">Город 1</b><span id="xp">0 / 100 XP</span></div></div>
<div class="panel">
<button class="tab active" data-tab="build">🏗️ Строительство</button><button class="tab" data-tab="city">🏙️ Город</button>
<button class="tab" data-tab="stats">📊 Статистика</button><button class="tab" data-tab="settings">⚙️ Настройки</button>
</div>
<div id="buildbar" class="buildbar"></div>
<div id="citybox" class="citybox"></div>
<div class="info"><small>Доход города</small><strong id="income">0 монет / сек</strong></div>
<div class="toast" id="toast"></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,D=1,cam={x:0,y:0,z:1},drag=null,selectedPlot=-1,selectedType='house',activeTab='build';
const TYPES={
house:{name:'Дом',icon:'🏠',cost:150,income:2,pop:12,xp:20,color:'#f0dfc8',roof:'#65534a'},
shop:{name:'Магазин',icon:'🏪',cost:400,income:7,pop:4,xp:35,color:'#e7cdb5',roof:'#6c5149'},
office:{name:'Офис',icon:'🏢',cost:900,income:18,pop:8,xp:60,color:'#b9d2d8',roof:'#53666b'},
park:{name:'Парк',icon:'🌳',cost:600,income:1,pop:20,xp:45,color:'#8fb77a',roof:'#63835b'}
};
const plots=[[-3,-3],[0,-3],[3,-3],[-3,-1],[3,-1],[-3,1],[3,1],[-3,3],[0,3],[3,3],[-5,0],[5,0],[-5,3],[5,3]];
let state=JSON.parse(localStorage.getItem('city_html5_v2')||'null')||{money:1000,buildings:Array(14).fill(null),totalEarned:0,xp:0,level:1};
function save(){localStorage.setItem('city_html5_v2',JSON.stringify(state))}
function money(n){return Math.floor(n).toLocaleString('ru-RU')}
function totals(){let income=0,pop=0;state.buildings.forEach(b=>{if(!b)return;let t=TYPES[b.type],mul=1+(b.level-1)*.35;income+=t.income*mul;pop+=t.pop});return{income,pop}}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',resize);
function iso(a,b){const s=Math.min(W/12,H/17)*cam.z;return{x:W/2+cam.x+(a-b)*s*.72,y:H/2+cam.y+(a+b)*s*.34}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function tree(px,py,k=.6){ctx.fillStyle='#6b4b38';ctx.fillRect(px-2,py+7,4,19*k);ctx.fillStyle='#4d814d';ctx.beginPath();ctx.arc(px,py,14*k,0,Math.PI*2);ctx.fill();ctx.fillStyle='#77a55d';ctx.beginPath();ctx.arc(px-7*k,py-4,9*k,0,Math.PI*2);ctx.arc(px+7*k,py-3,10*k,0,Math.PI*2);ctx.fill()}
function lamp(px,py){ctx.strokeStyle='#50483f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px,py+16);ctx.lineTo(px,py-9);ctx.stroke();ctx.fillStyle='#f5d78b';ctx.beginPath();ctx.arc(px,py-11,5,0,Math.PI*2);ctx.fill()}
function house(px,py,t,level){const w=t==='office'?64:t==='shop'?62:56,h=t==='office'?47:t==='shop'?40:34;ctx.fillStyle='rgba(40,45,35,.22)';ctx.beginPath();ctx.ellipse(px+5,py+h*.55,w*.72,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=TYPES[t].color;ctx.fillRect(px-w/2,py-h/2,w,h);poly([{x:px-w*.62,y:py-h/2},{x:px,y:py-h/2-(t==='office'?30:27)},{x:px+w*.62,y:py-h/2}],TYPES[t].roof,'#4c4039');if(t==='office'){ctx.fillStyle='#8eb1ba';for(let i=-1;i<2;i++)ctx.fillRect(px+i*17-5,py-10,10,18)}else{ctx.fillStyle='#f3d78b';ctx.fillRect(px-w*.28,py-9,12,10);ctx.fillRect(px+w*.08,py-9,12,10);ctx.fillStyle='#674c3c';ctx.fillRect(px-5,py-1,10,16)}if(level>1){ctx.fillStyle='#fff';ctx.font='700 10px Arial';ctx.textAlign='center';ctx.fillText('★ '+level,px,py+h*.65)}}
function fountain(){const q=iso(0,0),r=Math.min(W,H)*.105*cam.z;ctx.fillStyle='rgba(50,55,45,.2)';ctx.beginPath();ctx.ellipse(q.x+4,q.y+8,r*1.08,r*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c9bea9';ctx.beginPath();ctx.ellipse(q.x,q.y,r*1.08,r*.58,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#70b6c1';ctx.beginPath();ctx.ellipse(q.x,q.y,r*.82,r*.43,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f7f1e6';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#d9cfbf';ctx.beginPath();ctx.ellipse(q.x,q.y-r*.18,r*.22,r*.11,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(q.x,q.y-r*.18);ctx.quadraticCurveTo(q.x-7,q.y-r*.55,q.x,q.y-r*.7);ctx.quadraticCurveTo(q.x+7,q.y-r*.55,q.x,q.y-r*.18);ctx.stroke()}
function drawRoad(a,b,c,d){ctx.strokeStyle='#d1c5ad';ctx.lineWidth=44*cam.z;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2*cam.z;ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#8eae7a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#e8dfcc';poly([{x:35,y:30},{x:W-35,y:30},{x:W-55,y:H-30},{x:55,y:H-30}],'#e8dfcc','#cfc4ad');
const L=60,R=W-60,T=90,B=H-70,M=W/2;drawRoad(L,T,R,T);drawRoad(L,H/2,R,H/2);drawRoad(L,B,R,B);drawRoad(L,T,L,B);drawRoad(M,T,M,B);drawRoad(R,T,R,B);
plots.forEach((v,i)=>{const q=iso(v[0],v[1]),s=Math.min(W/12,H/17)*cam.z,w=s*1.55,h=s*.73;const active=i===selectedPlot;poly([{x:q.x,y:q.y-h},{x:q.x+w,y:q.y},{x:q.x,y:q.y+h},{x:q.x-w,y:q.y}],active?'#c8dda8':'#b7d597',active?'#4f8b58':'#809b69');tree(q.x-w*.58,q.y-h*.18,.42);tree(q.x+w*.58,q.y-h*.12,.38);const b=state.buildings[i];if(b)house(q.x,q.y,b.type,b.level);else{ctx.setLineDash([5,5]);ctx.strokeStyle=active?'#3f8b54':'rgba(255,255,255,.75)';ctx.lineWidth=active?3:1.5;ctx.beginPath();ctx.moveTo(q.x,q.y-h*.45);ctx.lineTo(q.x+w*.45,q.y);ctx.lineTo(q.x,q.y+h*.45);ctx.lineTo(q.x-w*.45,q.y);ctx.closePath();ctx.stroke();ctx.setLineDash([]);}});
fountain();for(let i=0;i<5;i++){lamp(W*.24+i*W*.13,H*.5)}for(let i=0;i<7;i++)tree(45+i*(W-90)/6,62+(i%2)*8,.62);for(let i=0;i<6;i++)tree(55+i*(W-110)/5,H-53-(i%2)*7,.62);updateUI()}
function updateUI(){const t=totals();document.getElementById('money').textContent=money(state.money);document.getElementById('pop').textContent=money(t.pop);document.getElementById('rate').textContent='+'+money(t.income)+'/сек';document.getElementById('income').textContent=money(t.income)+' монет / сек';document.getElementById('level').textContent='Город '+state.level;document.getElementById('xp').textContent=(state.xp%100)+' / 100 XP';renderBuildBar()}
function renderBuildBar(){const el=document.getElementById('buildbar');el.innerHTML='';if(activeTab!=='build'){el.style.display='none';return}el.style.display='flex';Object.entries(TYPES).forEach(([id,t])=>{const b=document.createElement('button');b.className=id===selectedType?'selected':'';b.innerHTML='<b>'+t.icon+'</b>'+t.name+' · '+money(t.cost)+' ₽';b.onclick=()=>{selectedType=id;renderBuildBar();draw()};el.appendChild(b)})}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1200)}
function selectPlot(i){selectedPlot=i;draw();if(activeTab==='city'){const b=state.buildings[i];const box=document.getElementById('citybox');box.style.display='block';box.innerHTML=b?'<b>'+TYPES[b.type].icon+' '+TYPES[b.type].name+' '+b.level+' ур.</b><div>Доход: +'+TYPES[b.type].income+' / сек · Жители: '+TYPES[b.type].pop+'</div>':'<b>Свободный участок</b><div>Выберите здание в строительстве.</div>'}}
let drag=null;
canvas.addEventListener('pointerdown',e=>{
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>6) drag.moved=true;
  // ВАЖНО: участки карты не двигаются от касания.
  // Перемещение карты отключено; drag оставлен только для определения свайпа.
});
canvas.addEventListener('pointerup',e=>{
  if(!drag)return;
  if(!drag.moved){
    let best=-1,bd=999;
    plots.forEach((v,i)=>{
      const q=iso(v[0],v[1]),s=Math.min(W/12,H/17)*cam.z,w=s*1.55,h=s*.73;
      const d=Math.abs((e.clientX-q.x)/w)+Math.abs((e.clientY-q.y)/h);
      if(d<1&&d<bd){bd=d;best=i}
    });
    if(best>=0){
      selectPlot(best);
      if(activeTab==='build'&&!state.buildings[best]){
        const t=TYPES[selectedType];
        if(state.money<t.cost) toast('Не хватает денег');
        else{
          state.money-=t.cost;
          state.buildings[best]={type:selectedType,level:1};
          state.xp+=t.xp;
          while(state.xp>=100){state.xp-=100;state.level++;toast('🎉 Новый уровень!')}
          save();toast(t.icon+' '+t.name+' построен');draw();
        }
      }
    }
  }
  drag=null;
});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.72,Math.min(1.55,cam.z*(e.deltaY<0?1.08:.92)));draw()},{passive:false});
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{activeTab=btn.dataset.tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===btn));document.getElementById('citybox').style.display=activeTab==='city'?'block':'none';if(activeTab==='stats')toast('Заработано: '+money(state.totalEarned)+' монет');if(activeTab==='settings')toast('Настройки: управление картой пальцем');renderBuildBar();draw()});
setInterval(()=>{const t=totals();if(t.income>0){state.money+=t.income;state.totalEarned+=t.income;save();updateUI()}},1000);
resize();
</script></body></html>
