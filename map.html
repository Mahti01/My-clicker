<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Город — карта</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8d6df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{touch-action:none}#app{width:100%;height:100%;position:relative;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.cards{display:flex;gap:8px}.card,.level,.income,.tab{background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.05);box-shadow:0 7px 22px rgba(45,58,48,.15);border-radius:17px}.card{min-width:104px;padding:9px 12px}.label{font-size:13px;color:#68716d}.value{font-size:19px;font-weight:800;margin-top:3px}.level{padding:10px 15px}.level b{font-size:18px;display:block}.level span{font-size:12px;color:#69726e}.panel{position:absolute;right:14px;top:108px;display:grid;grid-template-columns:145px 145px;gap:8px}.tab{height:56px;color:#3b83d3;font-weight:600;font-size:15px}.tab.active{background:#18231f;color:#fff}.bottom{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:end}.income{padding:11px 14px}.income small{display:block;color:#6c7672;font-size:13px}.income strong{font-size:19px}.reset{background:#fff;border:0;border-radius:16px;padding:10px 14px;color:#3983d3;font-size:15px}@media(max-width:700px){.card{min-width:0;width:100px;padding:8px 9px}.label{font-size:12px}.value{font-size:18px}.level{padding:9px 11px}.level b{font-size:17px}.panel{right:9px;top:104px;grid-template-columns:135px 135px}.tab{height:53px;font-size:14px}.bottom{left:9px;right:9px}.income{padding:10px 13px}}</style></head><body><div id="app"><canvas id="c"></canvas><div class="hud"><div class="cards"><div class="card"><div class="label">💰 Деньги</div><div class="value" id="m">1 000</div></div><div class="card"><div class="label">👥 Жители</div><div class="value" id="p">0</div></div><div class="card"><div class="label">📈 Доход</div><div class="value" id="r">+0/сек</div></div></div><div class="level"><b>Город 1</b><span id="xp">0 / 100 XP</span></div></div><div class="panel"><button class="tab active">🏗️ Строительство</button><button class="tab">🏙️ Город</button><button class="tab">📊 Статистика</button><button class="tab">⚙️ Настройки</button></div><div class="bottom"><div class="income"><small>Доход города</small><strong id="inc">0 монет / сек</strong></div><button class="reset" id="reset">Сбросить</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,build=[];
const plots=[[-3,-3],[0,-3],[3,-3],[-3,-1],[3,-1],[-3,1],[3,1],[-3,3],[0,3],[3,3],[-5,0],[5,0],[-5,3],[5,3]];
function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',size);
function iso(a,b){let s=Math.min(W/12,H/18);return{x:W/2+(a-b)*s*.72,y:H/2+(a+b)*s*.34}}
function poly(a,f,s){x.beginPath();a.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.closePath();x.fillStyle=f;x.fill();if(s){x.strokeStyle=s;x.lineWidth=2;x.stroke()}}
function tree(a,b,k=.6){x.fillStyle='#6a4d38';x.fillRect(a-2,b+5,4,18*k);x.fillStyle='#4f8950';x.beginPath();x.arc(a,b,14*k,0,7);x.fill();x.fillStyle='#79a95c';x.beginPath();x.arc(a-7,b-4,9*k,0,7);x.arc(a+7,b-3,10*k,0,7);x.fill()}
function house(a,b,shop=false){let w=shop?62:54,h=shop?40:34;x.fillStyle='rgba(50,50,40,.22)';x.beginPath();x.ellipse(a+7,b+h*.55,w*.7,9,0,0,7);x.fill();x.fillStyle=shop?'#e5d3bc':'#f3e9d7';x.fillRect(a-w/2,b-h/2,w,h);poly([{x:a-w*.62,y:b-h/2},{x:a,y:b-h/2-27},{x:a+w*.62,y:b-h/2}],shop?'#66534b':'#6d5a4d','#4e433c');x.fillStyle='#6a503f';x.fillRect(a-5,b-1,10,17);x.fillStyle='#f3d687';x.fillRect(a-w*.28,b-9,12,10);x.fillRect(a+w*.08,b-9,12,10)}
function fountain(){let q=iso(0,0),r=Math.min(W,H)*.105;x.fillStyle='rgba(50,55,45,.2)';x.beginPath();x.ellipse(q.x+5,q.y+8,r*1.08,r*.55,0,0,7);x.fill();x.fillStyle='#c9bea9';x.beginPath();x.ellipse(q.x,q.y,r*1.08,r*.58,0,0,7);x.fill();x.fillStyle='#70b6c1';x.beginPath();x.ellipse(q.x,q.y,r*.82,r*.43,0,0,7);x.fill();x.strokeStyle='#f4f0e7';x.lineWidth=4;x.stroke();x.fillStyle='#d8cfbf';x.beginPath();x.ellipse(q.x,q.y-r*.18,r*.22,r*.11,0,0,7);x.fill();x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;x.beginPath();x.moveTo(q.x,q.y-r*.18);x.quadraticCurveTo(q.x-6,q.y-r*.55,q.x,q.y-r*.7);x.quadraticCurveTo(q.x+6,q.y-r*.55,q.x,q.y-r*.18);x.stroke()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#8fb879';x.fillRect(0,0,W,H);x.fillStyle='#78aeb4';x.fillRect(0,0,W,18);x.fillRect(0,H-18,W,18);x.fillRect(0,0,18,H);x.fillRect(W-18,0,18,H);let L=65,R=W-65,T=100,B=H-80,Mx=W/2,My=H/2;x.fillStyle='#e6ddc9';poly([{x:35,y:35},{x:W-35,y:35},{x:W-55,y:H-35},{x:55,y:H-35}],'#e6ddc9','#d0c6ae');x.lineCap='round';function road(a,b,d,e){x.strokeStyle='#d0c4ad';x.lineWidth=44;x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke();x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=1;x.stroke()}road(L,T,R,T);road(L,My,R,My);road(L,B,R,B);road(L,T,L,B);road(Mx,T,Mx,B);road(R,T,R,B);
plots.forEach((v,i)=>{let q=iso(v[0],v[1]),s=Math.min(W/12,H/18),w=s*1.65,h=s*.78;poly([{x:q.x,y:q.y-h},{x:q.x+w,y:q.y},{x:q.x,y:q.y+h},{x:q.x-w,y:q.y}],'#b7d597','#7e9d69');x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.stroke();tree(q.x-w*.62,q.y-h*.18,.45);tree(q.x+w*.62,q.y-h*.12,.4);if(build[i])house(q.x,q.y,build[i]=='shop');else{x.setLineDash([5,5]);x.strokeStyle='rgba(255,255,255,.8)';x.beginPath();x.moveTo(q.x,q.y-h*.45);x.lineTo(q.x+w*.45,q.y);x.lineTo(q.x,q.y+h*.45);x.lineTo(q.x-w*.45,q.y);x.closePath();x.stroke();x.setLineDash([]);x.fillStyle='rgba(50,70,45,.55)';x.font='700 11px Arial';x.textAlign='center';x.fillText('УЧАСТОК',q.x,q.y+4)}});fountain();[[-.15,-.07],[.15,-.07],[-.11,.11],[.11,.11]].forEach(v=>{let q=iso(v[0]*8,v[1]*8);x.fillStyle='#f6d58b';x.beginPath();x.arc(q.x,q.y,5,0,7);x.fill();x.strokeStyle='#514b42';x.lineWidth=3;x.beginPath();x.moveTo(q.x,q.y+13);x.lineTo(q.x,q.y-8);x.stroke()});for(let i=0;i<7;i++)tree(45+i*(W-90)/6,70+(i%2)*8,.65);for(let i=0;i<6;i++)tree(55+i*(W-110)/5,H-58-(i%2)*8,.65)}
c.addEventListener('pointerdown',e=>{let s=Math.min(W/12,H/18),hit=-1;plots.forEach((v,i)=>{let q=iso(v[0],v[1]),w=s*1.65,h=s*.78;if(Math.abs((e.clientX-q.x)/w)+Math.abs((e.clientY-q.y)/h)<1)hit=i});if(hit>=0&&!build[hit]){build[hit]='house';document.getElementById('m').textContent=(1000-build.length*0).toLocaleString('ru-RU');document.getElementById('p').textContent=build.filter(Boolean).length*12;document.getElementById('r').textContent='+'+build.filter(Boolean).length*2+'/сек';document.getElementById('inc').textContent=build.filter(Boolean).length*2+' монет / сек';document.getElementById('xp').textContent=build.filter(Boolean).length*20+' / 100 XP';draw()}});document.getElementById('reset').onclick=()=>{build=[];size();document.getElementById('m').textContent='1 000';document.getElementById('p').textContent='0';document.getElementById('r').textContent='+0/сек';document.getElementById('inc').textContent='0 монет / сек';document.getElementById('xp').textContent='0 / 100 XP'};size();
</script></body></html>
